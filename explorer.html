<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorer les Aventures | Xtreme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .filter-btn.active { background-color: #FFD700; color: black; border-color: #FFD700; }
    </style>
</head>
<body class="bg-black text-white">

    <nav class="border-b border-white/10 py-6 px-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black uppercase tracking-tighter">L'AVENTURE <span class="text-[#FFD700]">XTREME</span></a>
            <a href="index.html" class="text-xs font-bold uppercase tracking-widest text-gray-400 hover:text-white transition">Accueil</a>
        </div>
    </nav>

    <section class="py-16 px-6 max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-8 mb-12">
            <div>
                <h1 class="text-5xl font-black uppercase italic tracking-tighter">Explorer <span class="text-[#FFD700]">le Club</span></h1>
                <p class="text-gray-500 mt-2 uppercase text-xs tracking-[0.3em]">Trouvez votre prochaine dose d'adrénaline</p>
            </div>

            <div class="flex flex-wrap gap-3">
                <button onclick="filterOffres('all')" class="filter-btn active px-6 py-2 border border-white/10 rounded-full text-xs font-black uppercase transition">Tout</button>
                <button onclick="filterOffres('sport')" class="filter-btn px-6 py-2 border border-white/10 rounded-full text-xs font-black uppercase transition">Sport</button>
                <button onclick="filterOffres('survie')" class="filter-btn px-6 py-2 border border-white/10 rounded-full text-xs font-black uppercase transition">Survie</button>
                <button onclick="filterOffres('vitesse')" class="filter-btn px-6 py-2 border border-white/10 rounded-full text-xs font-black uppercase transition">Vitesse</button>
            </div>
        </div>

        <div id="grid-offres" class="grid md:grid-cols-3 gap-8">
            </div>
    </section>

    <script>
        // Ta base de données d'offres
        const offres = [
            { id: 'padel', cat: 'sport', t: 'Padel Masterclass', p: 95, img: 'https://images.unsplash.com/photo-1596559058872-595ea5281b7b?w=600', d: 'Session intense et spa privé.' },
            { id: 'survie', cat: 'survie', t: 'Immersion Wild', p: 125, img: 'https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?w=600', d: 'Apprenez à dompter la nature.' },
            { id: 'roadtrip', cat: 'vitesse', t: 'Roadtrip Performance', p: 180, img: 'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=600', d: 'Pilotage sur routes sinueuses.' },
            { id: 'kayak', cat: 'sport', t: 'Kayak Xtreme', p: 75, img: 'https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=600', d: 'Descente rapide en rivière.' },
            { id: 'bivouac', cat: 'survie', t: 'Nuit Bivouac', p: 110, img: 'https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?w=600', d: 'Une nuit sous les étoiles.' },
            { id: 'chutelibre', cat: 'vitesse', t: 'Chute Libre', p: 250, img: 'https://images.unsplash.com/photo-1478131143081-80f7f84ca84d?w=600', d: 'Saut en tandem à 4000m.' },
            { id: 'plongee', cat: 'survie', t: 'Plongée Ice', p: 150, img: 'https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=600', d: 'Sous la glace en lac gelé.' },
            { id: 'escalade', cat: 'sport', t: 'Escalade Solo', p: 80, img: 'https://images.unsplash.com/photo-1522163182402-834f871fd851?w=600', d: 'Grimpe en falaise sécurisée.' }
        ];

        function displayOffres(items) {
            const grid = document.getElementById('grid-offres');
            grid.innerHTML = items.map(o => `
                <div class="bg-zinc-900 rounded-[2rem] overflow-hidden border border-white/5 group hover:border-[#FFD700]/50 transition-all duration-500">
                    <div class="h-56 relative overflow-hidden">
                        <img src="${o.img}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 opacity-70">
                        <div class="absolute top-4 right-4 bg-black/80 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest border border-white/10 text-[#FFD700] border-[#FFD700]/30">${o.cat}</div>
                    </div>
                    <div class="p-8">
                        <h3 class="text-xl font-black uppercase italic">${o.t}</h3>
                        <p class="text-gray-500 text-sm mt-2 mb-6 font-light">${o.d}</p>
                        <div class="flex justify-between items-center">
                            <span class="text-2xl font-black text-[#FFD700]">${o.p}€</span>
                            <a href="offre.html?activite=${o.id}" class="bg-white text-black px-6 py-2 rounded-xl font-black uppercase text-[10px] hover:bg-[#FFD700] hover:text-black transition shadow-lg">Détails</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterOffres(category) {
            // Update Boutons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.toLowerCase() === category.toLowerCase()) btn.classList.add('active');
                if(category === 'all' && btn.innerText.toLowerCase() === 'tout') btn.classList.add('active');
            });

            // Filtrage
            if(category === 'all') {
                displayOffres(offres);
            } else {
                const filtered = offres.filter(o => o.cat === category);
                displayOffres(filtered);
            }
        }

        // Initialisation
        displayOffres(offres);
    </script>
</body>
</html>
