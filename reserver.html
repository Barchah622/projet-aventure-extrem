<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Sécurisé | Xtreme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="notifications.css">
    <script src="notifications.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; }
        .text-gold { color: #FFD700; }
        .border-gold { border-color: #FFD700; }
        .bg-gold { background-color: #FFD700; }
        
        /* Glass effect */
        .glass-panel { 
            background: rgba(24, 24, 27, 0.6); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        
        /* Card number spacing */
        .card-input {
            letter-spacing: 0.1em;
        }
        
        /* Glow effect */
        .glow-gold {
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        
        /* Progress animation */
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,215,0,0.2), transparent);
            background-size: 1000px 100%;
            animation: shimmer 3s infinite;
        }
    </style>
</head>
<body class="text-white min-h-screen relative overflow-x-hidden">

    <!-- Background Effects -->
    <div class="fixed inset-0 pointer-events-none">
        <div class="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] bg-[#FFD700]/10 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[600px] h-[600px] bg-blue-600/10 rounded-full blur-[120px]"></div>
    </div>

    <!-- Progress Bar -->
    <div class="fixed top-0 left-0 w-full h-1 bg-zinc-800 z-50">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-[#FFD700] to-yellow-500 w-[20%] transition-all duration-500 glow-gold"></div>
    </div>

    <!-- Navigation -->
    <nav class="border-b border-white/10 py-6 px-6 relative z-10">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="text-2xl font-black uppercase tracking-tighter italic">L'AVENTURE <span class="text-gold">XTREME</span></div>
            <div class="flex items-center gap-3 text-xs font-bold uppercase tracking-widest text-[#FFD700]">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                Paiement SSL
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto py-12 px-6 relative z-10">
        
        <!-- Header -->
        <div class="mb-12">
            <a href="javascript:history.back()" class="text-[#FFD700] font-bold text-xs uppercase tracking-widest hover:underline inline-flex items-center gap-2 mb-6">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Retour
            </a>
            <h1 id="page-title" class="text-4xl md:text-6xl font-black uppercase italic tracking-tighter mb-4">Finaliser la Réservation</h1>
            <div class="flex items-baseline gap-4">
                <p class="text-gray-400 text-sm uppercase tracking-widest">Montant Total</p>
                <p id="total-amount" class="text-5xl font-black text-gold">0€</p>
            </div>
        </div>

        <form id="payment-form" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left Column: Contact Info -->
            <div class="lg:col-span-1 space-y-6">
                
                <!-- Personal Information -->
                <div class="glass-panel p-6 rounded-3xl relative overflow-hidden">
                    <div class="absolute -top-10 -right-10 w-32 h-32 bg-[#FFD700]/10 rounded-full blur-2xl"></div>
                    
                    <h3 class="text-xs font-black uppercase tracking-widest text-[#FFD700] mb-6 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        Informations de Contact
                    </h3>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="text-[10px] font-bold uppercase tracking-widest text-gray-500 mb-2 block">Prénom</label>
                            <input type="text" id="firstName" required class="payment-field w-full bg-black border border-white/20 rounded-xl p-4 outline-none focus:border-[#FFD700] transition text-white placeholder-gray-600" placeholder="John">
                        </div>
                        
                        <div>
                            <label class="text-[10px] font-bold uppercase tracking-widest text-gray-500 mb-2 block">Nom</label>
                            <input type="text" id="lastName" required class="payment-field w-full bg-black border border-white/20 rounded-xl p-4 outline-none focus:border-[#FFD700] transition text-white placeholder-gray-600" placeholder="Doe">
                        </div>
                        
                        <div>
                            <label class="text-[10px] font-bold uppercase tracking-widest text-gray-500 mb-2 block">Email</label>
                            <div class="relative">
                                <svg class="w-5 h-5 text-gray-500 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                <input type="email" id="email" name="email" required class="payment-field w-full bg-black border border-white/20 rounded-xl p-4 pl-12 outline-none focus:border-[#FFD700] transition text-white placeholder-gray-600" placeholder="john.doe@email.com">
                            </div>
                            <p class="text-[9px] text-gray-600 mt-1 ml-2">Votre billet sera envoyé à cette adresse</p>
                        </div>
                        
                        <div>
                            <label class="text-[10px] font-bold uppercase tracking-widest text-gray-500 mb-2 block">Téléphone</label>
                            <div class="relative">
                                <svg class="w-5 h-5 text-gray-500 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                <input type="tel" id="phone" required class="payment-field w-full bg-black border border-white/20 rounded-xl p-4 pl-12 outline-none focus:border-[#FFD700] transition text-white placeholder-gray-600" placeholder="+33 6 12 34 56 78">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Security Badge -->
                <div class="glass-panel p-4 rounded-2xl border-green-500/20">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-green-500/20 rounded-full flex items-center justify-center">
                            <svg class="w-6 h-6 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                        </div>
                        <div>
                            <p class="text-xs font-bold text-white">Paiement 100% Sécurisé</p>
                            <p class="text-[9px] text-gray-500">Cryptage SSL · Conformité PCI-DSS</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Payment Info -->
            <div class="lg:col-span-2 space-y-6">
                
                <!-- Payment Card -->
                <div class="glass-panel p-8 rounded-3xl relative overflow-hidden">
                    <div class="absolute -top-20 -right-20 w-48 h-48 bg-[#FFD700]/10 rounded-full blur-3xl shimmer"></div>
                    
                    <h3 class="text-xs font-black uppercase tracking-widest text-[#FFD700] mb-8 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                        Informations Bancaires
                    </h3>
                    
                    <div class="space-y-6">
                        <!-- Card Number -->
                        <div>
                            <label class="text-[10px] font-bold uppercase tracking-widest text-gray-500 mb-2 block">Numéro de Carte</label>
                            <div class="relative">
                                <svg class="w-6 h-6 text-gray-500 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                                <input type="text" id="cardNumber" maxlength="19" required class="payment-field card-input w-full bg-black border border-white/20 rounded-xl p-5 pl-14 outline-none focus:border-[#FFD700] transition text-white text-lg font-mono placeholder-gray-600" placeholder="1234 5678 9012 3456">
                                <div id="card-type" class="absolute right-4 top-1/2 -translate-y-1/2 w-12 h-8 bg-white/10 rounded flex items-center justify-center">
                                    <span class="text-[10px] font-bold text-gray-500">VISA</span>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-6">
                            <!-- Expiry Date -->
                            <div>
                                <label class="text-[10px] font-bold uppercase tracking-widest text-gray-500 mb-2 block">Date d'Expiration</label>
                                <input type="text" id="expiry" maxlength="5" placeholder="MM/AA" required class="payment-field w-full bg-black border border-white/20 rounded-xl p-5 outline-none focus:border-[#FFD700] transition text-white text-center font-mono tracking-widest placeholder-gray-600">
                            </div>
                            
                            <!-- CVV -->
                            <div>
                                <label class="text-[10px] font-bold uppercase tracking-widest text-gray-500 mb-2 block">Code de Sécurité</label>
                                <div class="relative">
                                    <input type="text" id="cvv" maxlength="3" placeholder="123" required class="payment-field w-full bg-black border border-white/20 rounded-xl p-5 outline-none focus:border-[#FFD700] transition text-white text-center font-mono tracking-widest placeholder-gray-600">
                                    <svg class="w-5 h-5 text-gray-500 absolute right-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                </div>
                            </div>
                        </div>

                        <!-- Cardholder Name -->
                        <div>
                            <label class="text-[10px] font-bold uppercase tracking-widest text-gray-500 mb-2 block">Titulaire de la Carte</label>
                            <input type="text" id="cardHolder" required class="payment-field w-full bg-black border border-white/20 rounded-xl p-5 outline-none focus:border-[#FFD700] transition text-white uppercase tracking-widest placeholder-gray-600" placeholder="NOM PRÉNOM">
                        </div>
                    </div>
                </div>

                <!-- Terms Checkbox -->
                <div class="glass-panel p-6 rounded-2xl">
                    <div class="flex items-start gap-4">
                        <input type="checkbox" id="cgv" required class="w-6 h-6 accent-[#FFD700] cursor-pointer mt-1 flex-shrink-0">
                        <label for="cgv" class="text-sm text-gray-300 leading-relaxed cursor-pointer">
                            J'accepte les <a href="#" onclick="openCGV(event)" class="text-[#FFD700] font-bold border-b border-[#FFD700] hover:text-white transition">Conditions Générales de Vente</a> et confirme que toutes les informations fournies sont exactes.
                        </label>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-gradient-to-r from-[#FFD700] to-yellow-500 text-black py-6 rounded-2xl font-black uppercase tracking-widest text-sm hover:scale-[1.02] hover:shadow-[0_0_40px_rgba(255,215,0,0.5)] transition-all duration-300 flex items-center justify-center gap-3 group">
                    <svg class="w-5 h-5 group-hover:rotate-12 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    Confirmer & Payer
                </button>

                <!-- Payment Methods -->
                <div class="flex justify-center items-center gap-6 opacity-40">
                    <span class="text-[10px] uppercase font-bold text-gray-500">Paiements acceptés</span>
                    <div class="flex gap-3">
                        <div class="w-10 h-6 bg-white/10 rounded border border-white/20 flex items-center justify-center text-[8px] font-bold">VISA</div>
                        <div class="w-10 h-6 bg-white/10 rounded border border-white/20 flex items-center justify-center text-[8px] font-bold">MC</div>
                        <div class="w-10 h-6 bg-white/10 rounded border border-white/20 flex items-center justify-center text-[8px] font-bold">AMEX</div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- CGV Modal -->
    <div id="cgv-modal" class="fixed inset-0 z-50 hidden bg-black/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-zinc-900 w-full max-w-4xl h-[80vh] rounded-3xl border border-white/10 flex flex-col shadow-2xl overflow-hidden relative">
            <button onclick="closeCGV()" class="absolute top-6 right-6 text-white hover:text-[#FFD700] z-10 p-3 bg-black/80 rounded-full transition-all hover:rotate-90">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <iframe src="cgv.html" class="w-full h-full border-none"></iframe>
        </div>
    </div>

    <script>
        // Get URL parameters
        const params = new URLSearchParams(window.location.search);
        const total = params.get('total') || '0€';
        const activity = params.get('activite') || 'Aventure';
        
        // Display info
        document.getElementById('total-amount').textContent = total;
        document.getElementById('page-title').textContent = `Réserver ${activity}`;

        // Auto-fill from localStorage
        const user = JSON.parse(localStorage.getItem('xtreme_user'));
        if (user) {
            if (user.name) document.getElementById('firstName').value = user.name;
            if (user.lastName) document.getElementById('lastName').value = user.lastName;
            if (user.email) {
                const emailInput = document.getElementById('email');
                emailInput.value = user.email;
                emailInput.style.borderColor = '#FFD700';
            }
            if (user.phone) document.getElementById('phone').value = user.phone;
        }

        // Progress bar update
        function updateProgress() {
            const fields = document.querySelectorAll('.payment-field');
            let filled = 0;
            fields.forEach(field => {
                if (field.value.trim()) filled++;
            });
            const progress = Math.min((filled / fields.length) * 100, 100);
            document.getElementById('progress-bar').style.width = progress + '%';
        }

        // Add event listeners to all payment fields
        document.querySelectorAll('.payment-field').forEach(field => {
            field.addEventListener('input', updateProgress);
        });

        // Format card number with spaces
        document.getElementById('cardNumber').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\s/g, '');
            let formattedValue = value.match(/.{1,4}/g)?.join(' ') || value;
            e.target.value = formattedValue;
            
            // Detect card type
            const cardType = document.getElementById('card-type');
            if (value.startsWith('4')) {
                cardType.innerHTML = '<span class="text-[10px] font-bold text-blue-400">VISA</span>';
            } else if (value.startsWith('5')) {
                cardType.innerHTML = '<span class="text-[10px] font-bold text-red-400">MC</span>';
            } else if (value.startsWith('3')) {
                cardType.innerHTML = '<span class="text-[10px] font-bold text-green-400">AMEX</span>';
            }
        });

        // Format expiry date
        document.getElementById('expiry').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.slice(0, 2) + '/' + value.slice(2, 4);
            }
            e.target.value = value;
        });

        // Allow only numbers for CVV
        document.getElementById('cvv').addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        // XP System: Calculate XP based on current level
        function calculateReservationXP(currentXP) {
            const BASE_XP = 30;
            // Determine level based on XP thresholds (simplified - matches profile ranks)
            const levels = [0, 750, 1500, 2250, 3375, 5063, 6750, 9375, 12188, 15000, 20000, 25000, 30000, 38750, 46875, 55000, 70000, 85000];
            let level = 0;
            for (let i = 0; i < levels.length; i++) {
                if (currentXP >= levels[i]) level = i;
                else break;
            }
            // Each level adds 25% (multiplier = 1 + 0.25 * level)
            const multiplier = 1 + (0.25 * level);
            return Math.round(BASE_XP * multiplier);
        }

        // Form submission
        document.getElementById('payment-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get current user
            const user = JSON.parse(localStorage.getItem('xtreme_user'));
            
            if (!user) {
                showError('Vous devez être connecté pour continuer.');
                setTimeout(() => window.location.href = 'login.html', 2000);
                return;
            }

            // Update user info with form data
            user.phone = document.getElementById('phone').value;
            localStorage.setItem('xtreme_user', JSON.stringify(user));

            // Create reservation
            const reservation = {
                id: '#TRIP-2026-' + Math.random().toString(36).substring(2, 8).toUpperCase(),
                activity: activity,
                date: '20 Mars 2026',
                time: '09:00 AM',
                seat: '4A (Premium)',
                price: total,
                status: 'Confirmé',
                bookedAt: new Date().toISOString()
            };

            // Save reservation
            if (!user.reservations) {
                user.reservations = [];
            }
            user.reservations.push(reservation);
            
            // Calculer et ajouter XP pour la réservation (progressif)
            if (!user.xp) user.xp = 0;
            const xpGain = calculateReservationXP(user.xp);
            user.xp += xpGain;
            
            // Sauvegarder l'XP gagné pour l'afficher
            reservation.xpEarned = xpGain;
            
            localStorage.setItem('xtreme_user', JSON.stringify(user));

            // Redirect to success page
            const successParams = new URLSearchParams({
                email: user.email,
                activite: activity,
                total: total,
                ticketId: reservation.id
            });
            window.location.href = `success.html?${successParams.toString()}`;
        });

        // CGV Modal
        function openCGV(e) {
            e.preventDefault();
            document.getElementById('cgv-modal').classList.remove('hidden');
        }
        
        function closeCGV() {
            document.getElementById('cgv-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
