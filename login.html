<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Xtreme Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; }
        .text-gold { color: #FFD700; }
        .border-gold { border-color: #FFD700; }
        .bg-gold { background-color: #FFD700; }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col items-center justify-center relative overflow-hidden">
    
    <!-- Background Video / Image -->
    <div class="absolute inset-0 z-0 opacity-20"><img src="https://images.unsplash.com/photo-1550989467-34d2846cc033?q=80&w=1770&auto=format&fit=crop" class="w-full h-full object-cover grayscale"></div>
    <div class="absolute inset-0 z-10 bg-gradient-to-t from-black via-transparent to-black"></div>

    <div class="relative z-20 w-full max-w-sm px-6">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black uppercase italic tracking-tighter mb-2">Espace <span class="text-gold">Membre</span></h1>
            <p class="text-gray-400 text-xs uppercase tracking-[0.2em]">Accès Réservé</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div class="relative group">
                <input type="email" id="email" required placeholder="Email" class="w-full bg-black/50 backdrop-blur-md border border-white/10 rounded-xl p-4 pl-12 focus:border-[#FFD700] outline-none transition text-white placeholder-gray-600">
                <svg class="w-5 h-5 text-gray-600 absolute left-4 top-4 group-focus-within:text-[#FFD700] transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path></svg>
            </div>
            
            <div class="relative group">
                <input type="password" id="password" required placeholder="Mot de Passe" class="w-full bg-black/50 backdrop-blur-md border border-white/10 rounded-xl p-4 pl-12 focus:border-[#FFD700] outline-none transition text-white placeholder-gray-600">
                <svg class="w-5 h-5 text-gray-600 absolute left-4 top-4 group-focus-within:text-[#FFD700] transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>

            <button type="submit" class="w-full bg-[#FFD700] text-black font-black uppercase tracking-widest py-4 rounded-xl hover:bg-white hover:scale-[1.02] transition shadow-[0_0_20px_rgba(255,215,0,0.2)] text-xs mt-6">
                Entrer
            </button>
        </form>

        <script>
            async function handleLogin(e) {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value; // AJOUTER L'ID password au HTML aussi si besoin
                
                try {
                    const response = await fetch('http://localhost:3000/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    
                    const result = await response.json();
                    
                    if(result.success) {
                        // Sauvegarder TOUT le profil récupéré du serveur (XP, réservations...)
                        localStorage.setItem('xtreme_user', JSON.stringify(result.user));
                        
                        // Redirection
                        window.location.href = 'index.html';
                    } else {
                        alert("Erreur: " + (result.message || "Identifiants invalides"));
                    }
                } catch (error) {
                    console.error(error);
                    alert("Erreur de connexion au serveur");
                }
            }
        </script>

        <div class="mt-8 text-center space-y-4">
            <p class="text-gray-500 text-xs">
                <a href="forgot-password.html" class="hover:text-[#FFD700] transition">Mot de passe oublié ?</a>
            </p>
            <p class="text-gray-400 text-xs">Nouveau membre ? <a href="inscription.html" class="text-[#FFD700] hover:text-white font-bold transition">Créer un compte</a></p>
            <a href="index.html" class="block text-gray-500 text-[10px] uppercase hover:text-white transition hover:underline">← Retour à l'accueil</a>
        </div>
    </div>
</body>
</html>
