<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billet Confirmé | Xtreme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; }
        .ticket-cut {
            mask: radial-gradient(circle at 0 50%, transparent 15px, black 16px), radial-gradient(circle at 100% 50%, transparent 15px, black 16px);
            mask-composite: exclude;
        }
        .text-gold { color: #FFD700; }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">
    
    <!-- Background Elements -->
    <div class="absolute top-0 left-0 w-full h-full bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-zinc-900 to-black z-0"></div>
    <div class="absolute inset-0 opacity-10" style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%23FFD700\' fill-opacity=\'1\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');"></div>

    <div class="relative z-10 w-full max-w-md">
        <!-- Success Message -->
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-[#FFD700] rounded-full flex items-center justify-center mx-auto mb-6 shadow-[0_0_30px_rgba(255,215,0,0.4)] animate-bounce">
                <svg class="w-10 h-10 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h1 class="text-3xl font-black uppercase italic tracking-tighter">Réservation <span class="text-gold">Confirmée</span></h1>
            <p class="text-gray-400 text-xs uppercase tracking-widest mt-2">Préparez-vous à l'aventure</p>
        </div>

        <!-- Digital Ticket -->
        <div class="bg-zinc-900 rounded-3xl overflow-hidden border border-white/10 shadow-2xl relative">
            <!-- Top Section -->
            <div class="p-8 border-b-2 border-dashed border-black/50 bg-gradient-to-br from-zinc-800 to-zinc-900 relative">
                <div class="absolute -left-4 bottom-[-16px] w-8 h-8 bg-black rounded-full"></div>
                <div class="absolute -right-4 bottom-[-16px] w-8 h-8 bg-black rounded-full"></div>
                
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest">Aventure</p>
                        <h2 id="act-name" class="text-2xl font-black uppercase italic text-white leading-none">Padel Master</h2>
                    </div>
                    <div class="text-right">
                        <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest">Date</p>
                        <p class="text-[#FFD700] font-black uppercase">20 Mars</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-2">
                    <div>
                        <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest">Départ</p>
                        <p class="font-bold text-sm">08:00 AM</p>
                    </div>
                    <div class="text-right">
                        <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest">Siège</p>
                        <p class="font-bold text-sm text-[#FFD700]">4A (Premium)</p>
                    </div>
                </div>
            </div>

            <!-- Bottom Section (QR) -->
            <div class="p-8 bg-white flex flex-col items-center justify-center relative">
                <div class="absolute -left-4 top-[-16px] w-8 h-8 bg-black rounded-full"></div>
                <div class="absolute -right-4 top-[-16px] w-8 h-8 bg-black rounded-full"></div>

                <div class="mb-4">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=XTREME-TICKET-2026-CONFIRMED" alt="QR Code" class="w-32 h-32">
                </div>
                <p class="text-black font-mono text-[10px] uppercase tracking-widest">Scan to Board • Xtreme Pass</p>
                <p class="text-gray-400 font-mono text-[8px] mt-1">ID: #TRIP-2026-X89</p>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="mt-8 flex gap-4 justify-center">
            <button onclick="window.print()" class="bg-zinc-800 border border-white/10 text-white px-6 py-3 rounded-xl font-bold uppercase text-[10px] hover:bg-white hover:text-black transition flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Télécharger
            </button>
            <a href="index.html" class="bg-[#FFD700] text-black px-8 py-3 rounded-xl font-bold uppercase text-[10px] hover:scale-105 transition shadow-[0_0_15px_#FFD700]">
                Continuer
            </a>
        </div>
    </div>
    <div id="toast-container" class="fixed top-6 right-6 z-50 flex flex-col gap-4"></div>

    <script>
        // Advanced Toast System
        function showToast(message, type = 'success', duration = 4000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            // Type configurations
            const configs = {
                loading: {
                    borderColor: 'border-blue-400',
                    textColor: 'text-blue-400',
                    bgGradient: 'from-blue-500/10 to-transparent',
                    icon: `<svg class="animate-spin w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                           </svg>`,
                    title: 'En cours...'
                },
                success: {
                    borderColor: 'border-green-400',
                    textColor: 'text-green-400',
                    bgGradient: 'from-green-500/10 to-transparent',
                    icon: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                           </svg>`,
                    title: 'Succès'
                },
                error: {
                    borderColor: 'border-red-400',
                    textColor: 'text-red-400',
                    bgGradient: 'from-red-500/10 to-transparent',
                    icon: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                           </svg>`,
                    title: 'Erreur'
                },
                info: {
                    borderColor: 'border-yellow-400',
                    textColor: 'text-yellow-400',
                    bgGradient: 'from-yellow-500/10 to-transparent',
                    icon: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                           </svg>`,
                    title: 'Information'
                }
            };
            
            const config = configs[type] || configs.info;
            
            toast.className = `bg-gradient-to-r ${config.bgGradient} backdrop-blur-sm bg-zinc-900/90 border ${config.borderColor} border-l-4 px-6 py-4 rounded-xl shadow-2xl flex items-center gap-4 transform translate-x-full transition-all duration-500 hover:scale-105`;
            toast.innerHTML = `
                <div class="${config.textColor} flex-shrink-0">
                    ${config.icon}
                </div>
                <div class="flex-1">
                    <h4 class="font-bold uppercase text-[10px] tracking-widest text-white mb-1">${config.title}</h4>
                    <p class="text-sm text-gray-300 leading-tight">${message}</p>
                </div>
                <button onclick="this.parentElement.remove()" class="text-gray-500 hover:text-white transition ml-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            `;
            
            container.appendChild(toast);
            
            // Slide In
            requestAnimationFrame(() => {
                toast.classList.remove('translate-x-full');
            });

            // Auto remove (except for loading type)
            if(type !== 'loading' && duration > 0) {
                setTimeout(() => {
                    toast.classList.add('translate-x-full', 'opacity-0');
                    setTimeout(() => toast.remove(), 500);
                }, duration);
            }
            
            return toast; // Return element so we can remove it manually
        }

        window.onload = async () => {
            const p = new URLSearchParams(window.location.search);
            const userEmail = p.get('email');
            
            // Populate UI dynamically
            const act = p.get('activite') || 'Aventure Xtreme';
            const date = '20 Mars 2026';
            const ticketId = '#TRIP-2026-' + Math.random().toString(36).substring(2, 7).toUpperCase();
            
            document.getElementById('act-name').innerText = act;
            // Update other UI elements if needed...

            if(userEmail) {
                // Show loading notification
                const loadingToast = showToast(`Préparation de votre billet pour ${userEmail}...`, "loading", 0);
                
                try {
                    const response = await fetch('http://localhost:3000/api/send-ticket', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: userEmail,
                            activity: act,
                            date: date,
                            ticketId: ticketId
                        })
                    }); 

                    // Remove loading toast
                    loadingToast.remove();

                    const result = await response.json();
                    
                    if(response.ok && result.success) {
                        // Success notification
                        showToast(`🎉 Billet envoyé avec succès à <strong>${userEmail}</strong> ! Vérifiez votre boîte mail.`, "success", 6000);
                        
                        // Show preview link if in test mode
                        if(result.preview) {
                            setTimeout(() => {
                                showToast(`Mode Test activé - Cliquez sur le lien en bas à gauche pour prévisualiser l'email`, "info", 8000);
                                const link = document.createElement('a');
                                link.href = result.preview;
                                link.target = '_blank';
                                link.className = 'fixed bottom-4 left-4 bg-blue-600 text-white px-4 py-2 rounded-lg text-xs z-50 hover:bg-blue-700 hover:shadow-lg transition-all flex items-center gap-2';
                                link.innerHTML = `
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                                    </svg>
                                    Voir Email (Mode Test)
                                `;
                                document.body.appendChild(link);
                            }, 1000);
                        }
                    } else {
                        // Server returned error
                        const errorMsg = result.message || result.error || 'Erreur inconnue';
                        showToast(`❌ Échec de l'envoi : ${errorMsg}`, "error", 8000);
                    }
                } catch(error) {
                    // Network or server error
                    loadingToast.remove();
                    showToast(`⚠️ Impossible de contacter le serveur email. Vérifiez que le serveur est démarré.<br><small class="text-gray-500">${error.message}</small>`, "error", 10000);
                    console.error('Email error:', error);
                }
            } else {
                showToast("⚠️ Aucun email fourni - Le billet ne sera pas envoyé", "info", 5000);
            }
        };
    </script>
</body>
</html>
