<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié | Xtreme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="notifications.css">
    <script src="notifications.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #000000 0%, #0a0a0a 100%); }
        
        .glass-card {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        .float { animation: float 6s ease-in-out infinite; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">

    <!-- Background Effects -->
    <div class="fixed inset-0 pointer-events-none">
        <div class="absolute top-[-20%] right-[-10%] w-[500px] h-[500px] bg-[#FFD700]/10 rounded-full blur-[150px] float"></div>
        <div class="absolute bottom-[-20%] left-[-10%] w-[600px] h-[600px] bg-blue-600/10 rounded-full blur-[150px] float" style="animation-delay: -3s;"></div>
    </div>

    <div class="max-w-md w-full relative z-10">
        <!-- Header -->
        <div class="text-center mb-8">
            <a href="login.html" class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-[#FFD700] to-yellow-600 rounded-2xl mb-4 hover:scale-110 transition">
                <span class="text-black text-2xl font-black">X</span>
            </a>
            <h1 class="text-4xl font-black uppercase italic text-white mb-2">
                Mot de Passe <span class="text-[#FFD700]">Oublié</span>
            </h1>
            <p class="text-gray-400 text-sm">Pas de problème, on va vous aider !</p>
        </div>

        <!-- Card -->
        <div class="glass-card rounded-3xl p-8 shadow-2xl">
            <div class="mb-6">
                <div class="w-20 h-20 bg-[#FFD700]/10 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <svg class="w-10 h-10 text-[#FFD700]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                    </svg>
                </div>
                <p class="text-center text-gray-400 text-sm">Entrez votre email et nous vous enverrons un lien pour réinitialiser votre mot de passe.</p>
            </div>

            <form id="forgot-form" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-2 tracking-wider">Adresse Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <input 
                            type="email" 
                            id="email" 
                            required
                            placeholder="votre-email@exemple.com"
                            class="w-full bg-black/50 border border-white/10 rounded-xl pl-12 pr-4 py-4 text-white focus:border-[#FFD700] focus:ring-2 focus:ring-[#FFD700]/20 outline-none transition"
                        >
                    </div>
                </div>

                <button 
                    type="submit" 
                    id="submit-btn"
                    class="w-full bg-gradient-to-r from-[#FFD700] to-yellow-500 text-black font-black uppercase py-4 rounded-xl hover:scale-105 transition-all duration-300 shadow-[0_0_30px_rgba(255,215,0,0.3)] flex items-center justify-center gap-2"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                    <span>Envoyer le Lien</span>
                </button>
            </form>

            <!-- Divider -->
            <div class="flex items-center gap-4 my-6">
                <div class="flex-1 h-px bg-white/10"></div>
                <span class="text-xs text-gray-600 uppercase font-bold">OU</span>
                <div class="flex-1 h-px bg-white/10"></div>
            </div>

            <!-- Back to Login -->
            <a href="login.html" class="block text-center py-3 border border-white/10 rounded-xl text-gray-400 hover:text-white hover:border-[#FFD700] transition-all font-bold uppercase text-sm">
                ← Retour à la connexion
            </a>
        </div>

        <!-- Help Text -->
        <p class="text-center text-gray-600 text-xs mt-6">
            Vous n'avez pas de compte ? <a href="inscription.html" class="text-[#FFD700] hover:underline font-bold">Inscrivez-vous</a>
        </p>
    </div>

    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const submitBtn = document.getElementById('submit-btn');
            
            // Disable button
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Envoi en cours...</span>
            `;
            
            try {
                const response = await fetch('http://localhost:3000/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showSuccess(`📧 Email envoyé ! Vérifiez votre boîte de réception : <strong>${email}</strong>`, 8000);
                    
                    // Clear form
                    document.getElementById('email').value = '';
                    
                    // Show additional info
                    setTimeout(() => {
                        showInfo('N\'oubliez pas de vérifier votre dossier SPAM si vous ne voyez pas l\'email.', 6000);
                    }, 2000);
                } else {
                    showError(result.message || 'Une erreur est survenue', 5000);
                }
            } catch (error) {
                console.error('Erreur:', error);
                showError('Impossible de contacter le serveur. Vérifiez qu\'il est démarré.', 5000);
            } finally {
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.innerHTML = `
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                    <span>Envoyer le Lien</span>
                `;
            }
        });
    </script>
</body>
</html>
