<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialiser le mot de passe | Xtreme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="notifications.css">
    <script src="notifications.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #000000 0%, #0a0a0a 100%); }
        
        .glass-card {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-[#FFD700] to-yellow-600 rounded-2xl mb-4">
                <span class="text-black text-2xl font-black">X</span>
            </div>
            <h1 class="text-4xl font-black uppercase italic text-white mb-2">
                Nouveau <span class="text-[#FFD700]">Mot de Passe</span>
            </h1>
            <p class="text-gray-400 text-sm">Choisissez un mot de passe sécurisé</p>
        </div>

        <div class="glass-card rounded-3xl p-8">
            <form id="reset-form" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Nouveau Mot de Passe</label>
                    <input 
                        type="password" 
                        id="password" 
                        required
                        minlength="6"
                        placeholder="••••••••"
                        class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-4 text-white focus:border-[#FFD700] outline-none transition"
                    >
                    <p class="text-xs text-gray-600 mt-2">Minimum 6 caractères</p>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Confirmer le Mot de Passe</label>
                    <input 
                        type="password" 
                        id="confirm-password" 
                        required
                        minlength="6"
                        placeholder="••••••••"
                        class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-4 text-white focus:border-[#FFD700] outline-none transition"
                    >
                </div>

                <button 
                    type="submit" 
                    class="w-full bg-gradient-to-r from-[#FFD700] to-yellow-500 text-black font-black uppercase py-4 rounded-xl hover:scale-105 transition shadow-[0_0_30px_rgba(255,215,0,0.3)]"
                >
                    Réinitialiser le Mot de Passe
                </button>
            </form>
        </div>
    </div>

    <script>
        // Get token from URL
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const email = params.get('email');

        if (!token || !email) {
            showError('Lien invalide ou expiré. Veuillez refaire une demande.');
            setTimeout(() => window.location.href = 'forgot-password.html', 3000);
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (password !== confirmPassword) {
                showError('Les mots de passe ne correspondent pas !');
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, token, newPassword: password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showSuccess('✅ Mot de passe réinitialisé avec succès !');
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    showError(result.message || 'Erreur lors de la réinitialisation');
                }
            } catch (error) {
                showError('Impossible de contacter le serveur');
            }
        });
    </script>
</body>
</html>
